add_newline = true

# Top-level keys (`format`, `right_format`, `palette`) MUST appear BEFORE any
# [table] header — TOML rule: once a [section] starts, every following
# `key = value` is part of that section. Putting `format` after [palettes.rcm]
# silently moves it into the palette table and starship falls back to defaults.

palette = "rcm"

# Bumped from the 500ms default: the dir_clean/dir_dirty/git_count modules each
# shell out to git, and a module that times out silently vanishes from the
# prompt. 1s is generous enough that a large repo still renders.
command_timeout = 1000

format = """
${custom.dir_clean}\
${custom.dir_dirty}\
${custom.git_count}\
$nodejs\
$python\
$ruby\
$cmd_duration\
$status\
$character\
"""

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[status]
# Shows the actual exit code on failure (e.g. 127 = not found, 130 = SIGINT).
# The red ➜ from [character] still fires too — this just adds the number.
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘ "
style = "bold red"

# ── Directory + working-tree state ────────────────────────────────────────────
# The path itself carries the git signal: bold cyan when the working tree is
# clean, bold yellow when there are uncommitted changes. custom.git_count then
# appends "N±", where N is the number of files with changes.
#
# `-uno` skips untracked files, which is what makes this fast enough to run on
# every prompt — scanning for untracked files is the expensive part of git
# status. Trade-off: a brand-new file shows nothing until you `git add` it.
#
# [directory] is disabled because its `style` is static — starship gives no way
# to vary it by git state. custom.dir_clean / custom.dir_dirty render the path
# instead. Both call prompt-dir.sh, which reimplements the truncation settings
# left below for reference; change them in BOTH places or they'll drift.
[directory]
disabled = true
truncation_length = 3         # mirrored as $max in prompt-dir.sh
truncate_to_repo = true       # in a repo: show path relative to repo root
truncation_symbol = "…/"      # leading "…/" when path is truncated

# Exactly one of these fires — the `when` conditions are mutually exclusive.
# Outside a git repo `git status` fails, so the clean (cyan) branch wins, which
# is what we want: no repo means nothing to be dirty about.
[custom.dir_clean]
command = '$HOME/.config/starship/prompt-dir.sh'
when = 'test -z "$(git status --porcelain -uno 2>/dev/null)"'
style = "bold cyan"
format = "[$output]($style) "

[custom.dir_dirty]
command = '$HOME/.config/starship/prompt-dir.sh'
when = 'test -n "$(git status --porcelain -uno 2>/dev/null)"'
style = "bold yellow"
format = "[$output]($style) "

# Count of tracked files with changes, staged or not. Hidden entirely when the
# tree is clean rather than showing "0±".
[custom.git_count]
command = 'git status --porcelain -uno 2>/dev/null | wc -l | tr -d " "'
when = 'test -n "$(git status --porcelain -uno 2>/dev/null)"'
style = "yellow"
format = "[$output±]($style) "

[cmd_duration]
min_time = 2000
format = "took [$duration](yellow) "

[aws]
disabled = true

[kubernetes]
disabled = true

[gcloud]
disabled = true

[git_branch]
disabled = true

[git_status]
disabled = true

[nodejs]
format = "[node $version](green) "

[python]
format = "[py $version](yellow) "

[ruby]
format = "[rb $version](red) "

# ── Palettes ──────────────────────────────────────────────────────────────────
# Defined LAST so the table header doesn't absorb top-level keys above. Add
# new palettes below and switch via the top-level `palette = "..."` line.
[palettes.rcm]
